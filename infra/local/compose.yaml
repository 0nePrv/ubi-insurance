# Локальная инфраструктура. Сервисы запускаются из IDE или через ./gradlew :services:<name>:bootRun.
#
#   docker compose -f infra/local/compose.yaml up -d                          # ядро
#   docker compose -f infra/local/compose.yaml --profile telematics up -d     # + ClickHouse (этап 3)
#   docker compose -f infra/local/compose.yaml --profile tools up -d          # + Kafka UI
name: ubi

services:
  postgres:
    # Postgres 17 + pgvector: одна физическая инстанция, но у каждого сервиса своя БД и свой пользователь
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  kafka:
    # KRaft, один узел: broker и controller в одном процессе
    image: apache/kafka:4.2.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      # PLAINTEXT — для приложений на хосте, INTERNAL — для контейнеров внутри compose-сети
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Топики создаются явно (NewTopic-бины в сервисах), а не опечаткой в имени топика у продюсера
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    ports: ["8180:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    volumes:
      - ./keycloak/ubi-realm.json:/opt/keycloak/data/import/ubi-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  clickhouse:
    profiles: ["telematics"]
    image: clickhouse/clickhouse-server:25.8
    ports: ["8123:8123", "9000:9000"]
    environment:
      CLICKHOUSE_USER: ubi
      CLICKHOUSE_PASSWORD: ubi
      CLICKHOUSE_DB: telematics
    volumes:
      - ch-data:/var/lib/clickhouse

  kafka-ui:
    profiles: ["tools"]
    image: ghcr.io/kafbat/kafka-ui:latest
    ports: ["8089:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: [kafka]

volumes:
  pg-data:
  ch-data:
