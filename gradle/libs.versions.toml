[versions]
spring-boot = "4.1.1"
# Spring Cloud 2025.1.x собран под Boot 4.0.x, релиза под 4.1 пока нет -> см. docs/adr/0003
spring-boot-gateway = "4.0.8"
spring-cloud = "2025.1.3"
spring-ai = "2.0.1"
kotlin = "2.4.20"
protobuf-plugin = "0.10.0"
# ДОЛЖНЫ совпадать с тем, что управляет Boot BOM (Protobuf Java и Grpc Java в spring-boot-dependencies 4.1.1)
protobuf = "4.35.1"
grpc = "1.83.1"
archunit = "1.5.0"

[libraries]
# BOM-ы
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-bom-gateway = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot-gateway" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }

# Отдельные библиотеки, которых нет в BOM
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
grpc-annotations-api = { module = "org.apache.tomcat:annotations-api", version = "6.0.53" }

# Gradle-плагины как обычные зависимости: так их можно применять в precompiled script plugins в build-logic
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
