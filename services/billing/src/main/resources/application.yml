spring:
  application:
    name: billing
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/billing
    username: billing
    password: billing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ubi

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
