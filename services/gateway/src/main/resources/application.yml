spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/ubi
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: policy
              uri: http://localhost:8081
              predicates:
                - Path=/api/quotes/**,/api/policies/**
            - id: telematics
              uri: http://localhost:8083
              predicates:
                - Path=/api/devices/**,/api/trips/**
            - id: claims
              uri: http://localhost:8084
              predicates:
                - Path=/api/claims/**
            - id: billing
              uri: http://localhost:8085
              predicates:
                - Path=/api/invoices/**,/api/payouts/**
            # rating наружу не публикуется: это внутренний gRPC-сервис

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
