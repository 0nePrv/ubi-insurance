syntax = "proto3";

package ubi.policy.v1;

import "ubi/common/v1/event_metadata.proto";
import "ubi/common/v1/money.proto";

option java_package = "dev.ubi.contracts.policy.v1";
option java_multiple_files = true;

// ИНТЕГРАЦИОННЫЕ события полиса — публичный контракт для других сервисов.
// Это НЕ те же события, что лежат в event store: внутренние (доменные) события — деталь
// реализации policy и могут меняться свободно, а эти эволюционируют только обратно совместимо.

message PolicyDrafted {
  ubi.common.v1.EventMetadata metadata = 1;
  string policy_id = 2;
  string holder_id = 3;  // subject из Keycloak
  ubi.common.v1.Money first_invoice_amount = 4;
}

message PolicyIssued {
  ubi.common.v1.EventMetadata metadata = 1;
  string policy_id = 2;
  string term_start = 3;
  string term_end = 4;
}

message PremiumAdjusted {
  ubi.common.v1.EventMetadata metadata = 1;
  string policy_id = 2;
  ubi.common.v1.Money monthly_premium = 3;
  string effective_from = 4;
}

message PolicyCancelled {
  ubi.common.v1.EventMetadata metadata = 1;
  string policy_id = 2;
  string effective_at = 3;
  string reason = 4;
}
